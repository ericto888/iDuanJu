name: player regression
on:
  workflow_dispatch:
  push:
    branches:
      - codex/player-pip-recovery
      - feat/ios-player-bottom-controls-gestures
permissions:
  contents: read

# Keep only the newest regression run for this branch; cancel stale queued/running runs.
concurrency:
  group: player-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      # Cache Homebrew downloads and avoid the implicit brew update on every fresh runner.
      - name: Cache XcodeGen installer
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-xcodegen-brew
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet xcodegen
          fi
          xcodegen --version
      # Keep Debug test products separate from the Release IPA cache.
      - name: Cache Swift packages and Debug build products
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedDataRelease/SourcePackages
            DerivedDataRelease/Build
          key: ${{ runner.os }}-xcode-26.3-player-debug-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.3-player-debug-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-
            ${{ runner.os }}-xcode-26.3-player-debug-
      - name: Test production player and gesture regressions
        run: |
          xcodegen generate
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; sdk=int(sys.argv[1].split(".")[0]); candidates=[(tuple(map(int,r.split("iOS-")[-1].split("-"))),d) for r,ds in json.load(sys.stdin)["devices"].items() if "iOS-" in r for d in ds if d["name"].startswith("iPhone")]; compatible=[(v,d) for v,d in candidates if v[0]==sdk]; assert compatible,"No simulator compatible with selected Xcode SDK"; print(max(compatible,key=lambda x:x[0])[1]["udid"])' "$SDK_VERSION")
          echo "Testing with SDK $SDK_VERSION on simulator $SIM"
          xcrun simctl boot "$SIM" || true
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],check=True,timeout=180)' "$SIM"
          set -o pipefail
          # Build once and run only the three UI regressions touched by this change.
          # Skip unrelated player, provider, and full home-navigation suites.
          xcodebuild -project STV.xcodeproj -scheme STV -configuration Debug -destination "platform=iOS Simulator,id=$SIM" -derivedDataPath DerivedDataRelease CODE_SIGNING_ALLOWED=NO ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES ENABLE_DEBUG_DYLIB=NO DEAD_CODE_STRIPPING=YES -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 -only-testing:STVUITests/PlayerUITests/testV3PopoversLandscapeAndBack -only-testing:STVUITests/PlayerUITests/testV3TimelineHasNoTenSecondSkipButtons -only-testing:STVUITests/HomeInteractionUITests/testHomeChromeHidesAndRestores test 2>&1 | tee "$RUNNER_TEMP/player-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-regression
          path: |
            ${{ runner.temp }}/player-tests.log
            DerivedDataRelease/Logs/Test/*.xcresult
