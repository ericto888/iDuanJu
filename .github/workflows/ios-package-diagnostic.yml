name: iOS package (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

# Intentionally independent from package.yml and player-validation.yml.
# No concurrency group and no cancel-in-progress behavior.
jobs:
  ios-package:
    name: iOS unsigned IPA (diagnostic)
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      STV_RUN_TESTS: '0'
      STV_BUILD_SIMULATOR: '0'
      STV_BUILD_LOG_DIR: ${{ runner.temp }}/ios-package-logs
    steps:
      - name: Runner diagnostics
        run: |
          echo "UTC start: $(date -u)"
          echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
          sw_vers
          xcode-select -p
          xcodebuild -version
          df -h
          mkdir -p "$STV_BUILD_LOG_DIR"

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Verify Xcode and tools
        run: |
          echo "UTC after Xcode setup: $(date -u)"
          xcodebuild -version
          xcodegen --version || true
          swift --version
          df -h

      - name: Cache XcodeGen installer
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-xcodegen-brew
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet xcodegen
          fi
          xcodegen --version

      - name: Cache Swift packages and Release build products
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedDataRelease/SourcePackages
            DerivedDataRelease/Build
          key: ${{ runner.os }}-xcode-26.3-ios-release-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.3-ios-release-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-
            ${{ runner.os }}-xcode-26.3-ios-release-

      - name: Build unsigned IPA
        run: |
          echo "UTC build start: $(date -u)"
          set -o pipefail
          scripts/package.sh "$RUNNER_TEMP/dist" 2>&1 | tee "$STV_BUILD_LOG_DIR/package-wrapper.log"
          echo "UTC build end: $(date -u)"

      - name: Collect diagnostics
        if: always()
        run: |
          echo "UTC finish: $(date -u)"
          xcodebuild -version || true
          df -h || true
          mkdir -p "$RUNNER_TEMP/diagnostics"
          cp -R "$STV_BUILD_LOG_DIR/." "$RUNNER_TEMP/diagnostics/" 2>/dev/null || true
          cp -R "$RUNNER_TEMP/dist/logs/." "$RUNNER_TEMP/diagnostics/" 2>/dev/null || true
          printf 'run=%s\nattempt=%s\nsha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/diagnostics/run-info.txt"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-package-diagnostics
          path: ${{ runner.temp }}/diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-diagnostic
          path: ${{ runner.temp }}/dist/*.ipa
          if-no-files-found: error
          retention-days: 7
