name: validate bug issue fields

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const { decideBugIssueAction } = require(
              path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/validate-bug-issue.js')
            );
            const issue = context.payload.issue;
            const decision = decideBugIssueAction({
              issue: {
                title: issue.title,
                body: issue.body,
                labels: issue.labels,
                created_at: issue.created_at,
                pull_request: issue.pull_request || null,
              },
            });
            core.info(JSON.stringify(decision));
            if (!decision.close) {
              return;
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'not_planned',
            });
