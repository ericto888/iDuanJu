name: release on tag

# Release packaging and publishing are manual-only. Pushing a tag must never build or publish by itself.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag already pushed to the repository (e.g. v1.5b15-novel-ui)
        required: true

permissions:
  contents: write

jobs:
  ios:
    name: build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedDataRelease/SourcePackages
          key: ${{ runner.os }}-swift-packages-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}
          restore-keys: ${{ runner.os }}-swift-packages-
      - name: Build unsigned IPA
        env:
          STV_RUN_TESTS: '0'
          STV_BUILD_SIMULATOR: '0'
        run: scripts/package.sh "$RUNNER_TEMP/dist"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ${{ runner.temp }}/dist/logs/*.log
          if-no-files-found: ignore
      - name: Save resolved Swift packages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedDataRelease/SourcePackages
          key: ${{ runner.os }}-swift-packages-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: |
            ${{ runner.temp }}/dist/*.ipa
          if-no-files-found: error

  apk:
    name: build release Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore distribution signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/iduanju.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/iduanju.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            ./gradlew :app:assembleRelease --stacktrace && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  simulator-regression:
    name: iOS Simulator regression tests
    # 手动触发时与 IPA 构建并行运行回归测试。
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - name: Cache XcodeGen installer
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-xcodegen-brew
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet xcodegen
          fi
          xcodegen --version
      - name: Cache Swift packages and simulator test products
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedDataValidation/SourcePackages
            DerivedDataValidation/Build
          key: ${{ runner.os }}-xcode-26.3-ios-validation-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.3-ios-validation-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-
            ${{ runner.os }}-xcode-26.3-ios-validation-
      - name: Run simulator-only regression tests
        env:
          STV_BUILD_LOG_DIR: ${{ runner.temp }}/ios-validation-logs
        run: bash scripts/validate-ios-simulator.sh
      - name: Upload simulator test logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-regression
          path: |
            ${{ runner.temp }}/ios-validation-logs/*.log
            DerivedDataValidation/Logs/Test/*.xcresult
          if-no-files-found: ignore
      - name: Publish build and test errors
        if: failure()
        run: |
          {
            echo '### Build and test errors'
            echo '```'
            grep -hE "(error:|fatal error:|BUILD FAILED|The following build commands failed|failed on|XCTAssert)" "$RUNNER_TEMP"/ios-validation-logs/*.log 2>/dev/null | tail -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: verify and publish GitHub Releases
    needs: [ios, apk, simulator-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PUSHED_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ios-unsigned
          path: dist/ios
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/android
      - name: Verify APK signature and manifest
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          TOOLS=$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose --print-certs dist/android/app-release.apk > apk-signature.txt
          if [ "$HAS_KEYSTORE" = "true" ]; then
            grep -qi 'a0750fb0907f21febe1ea3658ac595f4578d18cf9a8627ad59adfea37037c9c4' apk-signature.txt
          fi
          "$TOOLS/aapt" dump badging dist/android/app-release.apk > apk-manifest.txt
      - name: Verify IPA, derive tags, and compute checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, plistlib, re, zipfile

          pushed_tag = os.environ['PUSHED_TAG'].strip()
          assert re.fullmatch(r'v[0-9][0-9A-Za-z._-]{0,60}', pushed_tag), f'Unexpected tag: {pushed_tag}'
          assert not pushed_tag.endswith('-android'), 'Trigger tag must not end with -android'

          badging = pathlib.Path('apk-manifest.txt').read_text()
          m = re.search(r"package: name='app.iduanju' versionCode='(\d+)' versionName='([\d.]+)-android'", badging)
          assert m, f'Unexpected APK package/version: {badging[:300]}'
          android_code, android_version = m.groups()

          ipa_files = list(pathlib.Path('dist/ios').glob('*.ipa'))
          assert len(ipa_files) == 1, f'Expected one IPA, found {ipa_files}'
          ipa = ipa_files[0]
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None, 'Corrupt IPA'
              info = plistlib.loads(archive.read('Payload/STV.app/Info.plist'))
              assert info['CFBundleIdentifier'] == 'com.local.STV'
              assert 'iPhoneOS' in info['CFBundleSupportedPlatforms']
              assert archive.getinfo('Payload/STV.app/STV').file_size > 0
          ios_version, ios_build = info['CFBundleShortVersionString'], info['CFBundleVersion']
          assert re.fullmatch(r'\d+\.\d+(?:\.\d+)?', ios_version)
          assert re.fullmatch(r'\d+', ios_build)

          suffix_match = re.match(r'^v\d+(?:\.\d+)*(?:b\d+)?-([a-zA-Z0-9][a-zA-Z0-9._-]*)$', pushed_tag)
          suffix = suffix_match.group(1) if suffix_match else ''
          suffix_dash = f'-{suffix}' if suffix else ''
          ios_tag = pushed_tag
          android_tag = f'v{android_version}{suffix_dash}-android'

          apk = pathlib.Path('dist/android/app-release.apk')
          apk = apk.rename(apk.with_name(f'iDuanJu-{android_version}{suffix_dash}-android.apk'))

          for package in (apk, ipa):
              digest = hashlib.sha256(package.read_bytes()).hexdigest()
              package.with_name('SHA256SUMS.txt').write_text(f'{digest}  {package.name}\n')
              print(f'Verified {package.name}: SHA256 {digest}')

          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'ANDROID_VERSION={android_version}\nANDROID_CODE={android_code}\n')
              out.write(f'IOS_VERSION={ios_version}\nIOS_BUILD={ios_build}\n')
              out.write(f'IOS_TAG={ios_tag}\nANDROID_TAG={android_tag}\n')
          PY
      - name: Stage and publish both Releases
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SHA=$(git rev-parse HEAD)
          RUN_URL="https://github.com/$GH_REPO/actions/runs/${GITHUB_RUN_ID}"

          for tag in "$ANDROID_TAG" "$IOS_TAG"; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; refusing to overwrite." >&2
              exit 1
            fi
          done

          NOTES_SRC=""
          if [ -f "docs/releases/${PUSHED_TAG}.md" ]; then
            NOTES_SRC="docs/releases/${PUSHED_TAG}.md"
          fi

          for platform in android ios; do
            if [ "$platform" = android ]; then
              tag="$ANDROID_TAG"
              title="i短剧 Android ${ANDROID_VERSION} (${tag})"
              install="包内版本为 ${ANDROID_VERSION}-android（versionCode ${ANDROID_CODE}）。使用统一分发证书签名，可直接覆盖同签名旧版。"
            else
              tag="$IOS_TAG"
              title="i短剧 iOS ${IOS_VERSION}b${IOS_BUILD} (${tag})"
              install="包内版本为 ${IOS_VERSION} build ${IOS_BUILD}。IPA 未签名（最低 iOS 18），请自行重签侧载。"
            fi

            if [ -n "$NOTES_SRC" ]; then
              cp -- "$NOTES_SRC" "$platform-notes.md"
              printf '\n---\n%s\n\n请选择 Assets 中的 APK / IPA，不要下载 Source code。SHA-256 见附件。\n构建源码：%s\n自动构建：%s\n' "$install" "$BUILD_SHA" "$RUN_URL" >> "$platform-notes.md"
            else
              cat > "$platform-notes.md" <<EOF
          $title

          $install

          请选择 Assets 中的 APK / IPA，不要下载 Source code。SHA-256 见附件。
          构建源码：$BUILD_SHA
          自动构建：$RUN_URL
          EOF
            fi

            gh release create "$tag" dist/"$platform"/* --target "$BUILD_SHA" --title "$title" --notes-file "$platform-notes.md" --prerelease --draft
            gh release view "$tag" --json assets > "$platform-assets.json"
            PLATFORM="$platform" python3 - <<'PY'
          import hashlib, json, os, pathlib
          platform = os.environ['PLATFORM']
          assets = {a['name']: a for a in json.load(open(platform + '-assets.json'))['assets']}
          for file in pathlib.Path('dist', platform).iterdir():
              asset = assets[file.name]
              assert asset['size'] == file.stat().st_size
              digest = asset.get('digest')
              if digest:
                  assert digest == 'sha256:' + hashlib.sha256(file.read_bytes()).hexdigest()
          PY
          done

          # Publish both platforms atomically after both uploads and digests verify.
          for tag in "$ANDROID_TAG" "$IOS_TAG"; do
            gh release edit "$tag" --draft=false --prerelease
          done
