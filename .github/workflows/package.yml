name: package

# iOS-only packaging. Regression tests live in the separate validation workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: unsigned iOS package
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Match the regression workflow so tested and packaged SDKs are identical.
          xcode-version: "26.3"
      - name: Cache XcodeGen installer
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-xcodegen-1.2.1-homebrew
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet xcodegen
          fi
          xcodegen --version
      # Release products are cached independently from Debug regression products.
      - name: Cache Swift packages and Release build products
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedDataRelease/SourcePackages
            DerivedDataRelease/Build
          key: ${{ runner.os }}-xcode-26.3-ios-release-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.3-ios-release-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-
            ${{ runner.os }}-xcode-26.3-ios-release-
      - name: Build unsigned IPA
        env:
          STV_RUN_TESTS: '0'
          STV_BUILD_SIMULATOR: '0'
        run: scripts/package.sh "$RUNNER_TEMP/dist"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ${{ runner.temp }}/dist/logs/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: ${{ runner.temp }}/dist/*.ipa
          if-no-files-found: error
