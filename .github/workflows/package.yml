name: package

# Device IPA packaging and simulator regression tests run independently.
# A slow simulator test suite must never block delivery of the unsigned IPA.
on:
  # IPA 构建必须由人员在 Actions 中手动确认触发；push 永不自动打包 IPA。
  workflow_dispatch:
  push:
    branches:
      - feat/online-source-store
      - feat/plugin-builtin-source-overrides
      - main

permissions:
  contents: read

jobs:
  ios:
    name: unsigned iOS package
    # IPA 仅允许通过 GitHub Actions 的 Run workflow 人工触发。
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - name: Cache XcodeGen installer
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-xcodegen-brew
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet xcodegen
          fi
          xcodegen --version
      - name: Cache Swift packages and Release device build products
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedDataRelease/SourcePackages
            DerivedDataRelease/Build
          key: ${{ runner.os }}-xcode-26.3-ios-release-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.3-ios-release-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-
            ${{ runner.os }}-xcode-26.3-ios-release-
      - name: Build unsigned IPA (device only)
        env:
          STV_RUN_TESTS: '0'
          STV_BUILD_SIMULATOR: '0'
        run: scripts/package.sh "$RUNNER_TEMP/dist"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ${{ runner.temp }}/dist/logs/*.log
          if-no-files-found: ignore
      - name: Publish build errors
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -hE "(error:|fatal error:|BUILD FAILED|The following build commands failed)" "$RUNNER_TEMP"/dist/logs/*.log 2>/dev/null | tail -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: ${{ runner.temp }}/dist/*.ipa
          if-no-files-found: error

  simulator-regression:
    name: iOS Simulator regression tests
    # Push 仅运行模拟器回归，不构建 IPA；手动构建时不重复跑测试。
    if: github.event_name == 'push'
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - name: Cache XcodeGen installer
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-xcodegen-brew
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet xcodegen
          fi
          xcodegen --version
      - name: Cache Swift packages and simulator test products
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            DerivedDataValidation/SourcePackages
            DerivedDataValidation/Build
          key: ${{ runner.os }}-xcode-26.3-ios-validation-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-26.3-ios-validation-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Package.resolved') }}-
            ${{ runner.os }}-xcode-26.3-ios-validation-
      - name: Run simulator-only regression tests
        env:
          STV_BUILD_LOG_DIR: ${{ runner.temp }}/ios-validation-logs
        run: bash scripts/validate-ios-simulator.sh
      - name: Upload simulator test logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-regression
          path: |
            ${{ runner.temp }}/ios-validation-logs/*.log
            DerivedDataValidation/Logs/Test/*.xcresult
          if-no-files-found: ignore
      - name: Publish build and test errors
        if: failure()
        run: |
          {
            echo '### Build and test errors'
            echo '```'
            grep -hE "(error:|fatal error:|BUILD FAILED|The following build commands failed|failed on|XCTAssert)" "$RUNNER_TEMP"/ios-validation-logs/*.log 2>/dev/null | tail -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
