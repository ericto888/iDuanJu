name: search feature IPA
on:
  push:
    branches:
      - feature/source-aware-search-autocomplete
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet xcodegen
          fi
          xcodegen --version
      - name: Build unsigned IPA
        env:
          STV_RUN_TESTS: '0'
          STV_BUILD_SIMULATOR: '0'
        run: scripts/package.sh "$RUNNER_TEMP/dist"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-feature-build-logs
          path: ${{ runner.temp }}/dist/logs/*.log
          if-no-files-found: ignore
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: search-feature-ipa
          path: ${{ runner.temp }}/dist/*.ipa
          if-no-files-found: error
